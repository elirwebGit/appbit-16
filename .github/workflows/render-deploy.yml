name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Service ID não é segredo (identificador do web service no Render)
      RENDER_SERVICE_ID: srv-db7a9n7avr4c73fenbp0
    steps:
      - name: Check RENDER_API_KEY
        id: check
        run: echo "present=${{ secrets.RENDER_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: steps.check.outputs.present == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Skip notice
        if: steps.check.outputs.present != 'true'
        run: echo "RENDER_API_KEY secret not set — skipping API deploy. Add it in Settings → Secrets → Actions."
