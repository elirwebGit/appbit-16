name: Deploy PWA to Vercel

on:
  push:
    branches: [main]
    paths:
      - "apps/pwa/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_lZgh5xXbsabh66B8jrR07wQQ
      VERCEL_PROJECT_ID: prj_y3pIrSeHZpXDCUzq7NIvJsv1utL0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check VERCEL_TOKEN
        id: check
        run: echo "present=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel (production)
        if: steps.check.outputs.present == 'true'
        working-directory: apps/pwa
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Skip notice
        if: steps.check.outputs.present != 'true'
        run: echo "VERCEL_TOKEN secret not set — skipping deploy. Add it in Settings → Secrets → Actions."
